name: Contract and Newman Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Lint OpenAPI
        run: npx @redocly/cli lint contracts/*.yaml
      - name: Install Prism
        run: npm install -g @stoplight/prism-cli
      - name: Start mock server
        run: |
          nohup npx prism mock contracts/core-business.openapi.yaml \
          --port 4010 \
          --host 0.0.0.0 > prism.log 2>&1 &

      - name: Wait 5s for Prism
        run: sleep 5

      - name: Show Prism log (DEBUG)
        run: cat prism.log

      - name: Wait for mock
        run: npx wait-on http-get://localhost:4010/health --timeout 60000

      - name: Run Newman
        run: |
          npx newman run postman/collections/core.postman_collection.json \
          -e postman/environments/mock.json \
          -r cli,junit \
          --reporters-junit-export reports/newman-report.xml

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/

      - name: Show Prism log if failed
        if: failure()
        run: cat prism.log